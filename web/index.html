<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://discord.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
  <title>HypeSquad ハウス変更</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #202127; color: #f4f4f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 18px; }
    main { width: min(100%, 520px); padding: clamp(22px, 5vw, 36px); background: #2b2d35; border: 1px solid #474955; border-radius: 16px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 5vw, 1.8rem); }
    p { color: #d2d4dc; line-height: 1.6; }
    .notice { padding: 12px 14px; border-radius: 9px; background: #383a47; font-size: .9rem; }
    label { display: block; font-weight: 600; margin: 22px 0 8px; }
    .token-row { display: flex; gap: 8px; }
    input { min-width: 0; flex: 1; padding: 12px; color: #fff; background: #18191e; border: 1px solid #85899a; border-radius: 8px; font: inherit; }
    button { border: 0; border-radius: 8px; padding: 12px 14px; background: #5865f2; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover:not(:disabled) { filter: brightness(1.13); }
    button:focus-visible, input:focus-visible { outline: 3px solid #b6c1ff; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: wait; }
    .secondary { background: #515564; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
    .leave { grid-column: 1 / -1; }
    #status { min-height: 1.5em; margin-bottom: 0; }
    #status[data-kind="error"] { color: #ffc5c5; }
    #status[data-kind="success"] { color: #aff0cb; }
    @media (max-width: 420px) { .actions { grid-template-columns: 1fr; } .leave { grid-column: auto; } }
  </style>
</head>
<body>
  <main>
    <h1>HypeSquad ハウス変更</h1>
    <p>Bravery・Brilliance・Balance を選ぶか、ハウスから退室します。</p>
    <p class="notice">非公式の機能です。Discord側でAPIが停止・変更される場合があります。ブラウザのCORS制限により、このページから直接通信できない環境ではPython版を使ってください。トークンは自分のものだけ入力してください。</p>
    <label for="token">Discordトークン</label>
    <div class="token-row">
      <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="token-help">
      <button id="toggle" class="secondary" type="button" aria-label="トークンを表示">表示</button>
    </div>
    <p id="token-help">このページはトークンを保存しません。操作後は入力欄を消去します。</p>
    <div class="actions">
      <button type="button" data-house="1">Bravery</button>
      <button type="button" data-house="2">Brilliance</button>
      <button type="button" data-house="3">Balance</button>
      <button type="button" data-house="leave" class="secondary leave">退室する</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    'use strict';
    const endpoint = 'https://discord.com/api/v9/hypesquad/online';
    const labels = { 1: 'Bravery', 2: 'Brilliance', 3: 'Balance' };
    const tokenInput = document.querySelector('#token');
    const status = document.querySelector('#status');
    const actions = [...document.querySelectorAll('[data-house]')];
    const toggle = document.querySelector('#toggle');
    let busy = false;

    function report(message, kind = '') {
      status.textContent = message;
      status.dataset.kind = kind;
    }

    toggle.addEventListener('click', () => {
      const hidden = tokenInput.type === 'password';
      tokenInput.type = hidden ? 'text' : 'password';
      toggle.textContent = hidden ? '隠す' : '表示';
      toggle.setAttribute('aria-label', hidden ? 'トークンを隠す' : 'トークンを表示');
    });

    async function changeHouse(house) {
      if (busy) return;
      const token = tokenInput.value.trim();
      if (!token || /[\r\n]/.test(token)) {
        report('有効なトークンを1行で入力してください。', 'error');
        tokenInput.focus();
        return;
      }

      busy = true;
      actions.forEach(button => { button.disabled = true; });
      report('Discordに送信しています…');
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(endpoint, {
          method: house === 'leave' ? 'DELETE' : 'POST',
          headers: { Authorization: token, ...(house === 'leave' ? {} : { 'Content-Type': 'application/json' }) },
          ...(house === 'leave' ? {} : { body: JSON.stringify({ house_id: Number(house) }) }),
          signal: controller.signal
        });
        if (response.ok) {
          report(house === 'leave' ? '退室リクエストが受け付けられました。' : `${labels[house]}への変更が受け付けられました。`, 'success');
        } else {
          const messages = {
            401: '認証に失敗しました。トークンを確認してください。',
            403: 'Discordが操作を拒否しました。',
            429: 'リクエストが制限されました。時間をおいてください。'
          };
          report(messages[response.status] || `Discordが受け付けませんでした（HTTP ${response.status}）。APIの変更や提供終了の可能性があります。`, 'error');
        }
      } catch (error) {
        report(error.name === 'AbortError'
          ? '通信がタイムアウトしました。状態を確認してから再試行してください。'
          : '通信に失敗しました。ブラウザのCORS制限、ネットワーク、Discord側の状態を確認してください。', 'error');
      } finally {
        clearTimeout(timer);
        tokenInput.value = '';
        tokenInput.type = 'password';
        toggle.textContent = '表示';
        toggle.setAttribute('aria-label', 'トークンを表示');
        actions.forEach(button => { button.disabled = false; });
        busy = false;
      }
    }

    actions.forEach(button => button.addEventListener('click', () => changeHouse(button.dataset.house)));
  </script>
</body>
</html>
